<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squadrats for Mapy.com</title>
  <link rel="stylesheet" href="ui.css">
  <style>body { width: 300px; padding: 14px 16px 16px; }</style>
</head>
<body>
  <h1>Squadrats for Mapy.com</h1>

  <label class="row"><span>Overlay on</span><input type="checkbox" id="enabled"></label>

  <h2>Grid lines</h2>
  <label class="row"><span class="sw"><i class="dot" id="dA"></i>Squadrats (z14)</span><input type="checkbox" id="gridSquadrats"></label>
  <label class="row"><span class="sw"><i class="dot" id="dB"></i>Squadratinhos (z17)</span><input type="checkbox" id="gridSquadratinhos"></label>

  <h2>Visited tiles</h2>
  <label class="row"><span class="sw"><i class="dot" id="fA"></i>Squadrats</span><input type="checkbox" id="fillSquadrats"></label>
  <label class="row"><span class="sw"><i class="dot" id="fB"></i>Squadratinhos</span><input type="checkbox" id="fillSquadratinhos"></label>
  <label class="row"><span>Fill opacity</span><input type="range" id="fillOpacity" min="0.05" max="0.9" step="0.05"></label>

  <p id="counts" class="hint"></p>
  <button id="open" class="primary">Import KML &amp; calibrate…</button>

  <script src="geo.js"></script>
  <script src="popup.js"></script>
</body>
</html>
