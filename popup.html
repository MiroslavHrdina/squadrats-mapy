<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squadrats for Mapy.com</title>
  <link rel="stylesheet" href="ui.css">
  <style>body { width: 300px; padding: 14px 16px 16px; }  select { font: inherit; padding: 3px 6px; border-radius: 6px; background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  </style>
</head>
<body>
  <h1>Squadrats for Mapy.com</h1>

  <label class="row"><span>Overlay on</span><input type="checkbox" id="enabled"></label>

  <h2>Grid lines</h2>
  <label class="row"><span class="sw"><i class="dot" id="dA"></i>Squadrats (z14)</span><input type="checkbox" id="gridSquadrats"></label>
  <label class="row"><span class="sw"><i class="dot" id="dB"></i>Squadratinhos (z17)</span><input type="checkbox" id="gridSquadratinhos"></label>
  <label class="row"><span>Line opacity</span><input type="range" id="lineOpacity" min="0.05" max="1" step="0.05"></label>
  <label class="row"><span>Line thickness</span><input type="range" id="lineWidth" min="0.5" max="3" step="0.25"></label>
  <label class="row"><span>Grid colours</span><select id="gridColorMode"><option value="two">Two colours</option><option value="one">One colour</option></select></label>

  <h2>Visited tiles</h2>
  <label class="row"><span class="sw"><i class="dot" id="fA"></i>Squadrats</span><input type="checkbox" id="fillSquadrats"></label>
  <label class="row"><span class="sw"><i class="dot" id="fB"></i>Squadratinhos</span><input type="checkbox" id="fillSquadratinhos"></label>
  <label class="row"><span>Visited colours</span><select id="fillColorMode"><option value="two">Two colours</option><option value="one">One colour</option></select></label>
  <label class="row"><span>Fill opacity</span><input type="range" id="fillOpacity" min="0.05" max="0.9" step="0.05"></label>

  <p id="counts" class="hint"></p>
  <p id="status" class="hint"></p>
  <button id="open" class="primary">Import KML &amp; calibrate…</button>
  <button id="reset">Reset settings</button>

  <script src="geo.js"></script>
  <script src="popup.js"></script>
</body>
</html>
